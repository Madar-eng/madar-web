<style>
:root{--bg:#f5f7fb;--card:#fff;--fg:#14181f;--mut:#667085;--line:#e3e8ef;--pri:#1b4dff;--onpri:#fff;--ok:#12805c;--warn:#b54708;--bad:#c01048;color-scheme:light dark}

*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
main{max-width:720px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:1.25rem;margin:0}h2{font-size:1.05rem;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px}
.btn{appearance:none;border:0;background:var(--pri);color:var(--onpri);border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:.9rem}.btn:disabled{opacity:.5}
.btn.danger{background:transparent;color:var(--bad);border:1px solid var(--line)}
input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit;margin:4px 0 10px}
label{font-size:.9rem;color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:12px}
.tabs button{flex:1;padding:9px 4px;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;font:inherit;cursor:pointer}
.tabs button.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.mut{color:var(--mut);font-size:.9rem}
.chip{font-size:.8rem;padding:2px 10px;border-radius:99px;border:1px solid currentColor}
.pending{color:var(--warn)}.approved{color:var(--ok)}.rejected{color:var(--bad)}
.price{font-weight:700;white-space:nowrap}
.alias{font-size:1.4rem;font-weight:800;direction:ltr;text-align:center;padding:10px;border:2px dashed var(--pri);border-radius:12px;margin:10px 0}
.vid{position:relative;padding-top:56.25%;background:#000;border-radius:12px;overflow:hidden}
.vid iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.msg{padding:10px;border-radius:10px;margin:8px 0;background:var(--card);border:1px solid var(--line)}
.err{color:var(--bad)}.center{text-align:center}
footer{margin-top:24px;text-align:center}
.pdfbox{position:relative;background:#525659;border-radius:10px;padding:8px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.pdfbox canvas{display:block;width:100%;margin:0 auto 8px;background:#fff}.wmlay{position:absolute;inset:0;pointer-events:none}.ctl{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:8px;direction:ltr}.pdfbox canvas{height:auto}.ytshield{position:absolute;inset:0;z-index:2;cursor:pointer;-webkit-touch-callout:none}.ytwm{z-index:3}.ytbox:fullscreen,.ytbox:-webkit-full-screen,.ytbox.fs{background:#000;display:flex;flex-direction:column;justify-content:center}.ytbox.fs{position:fixed;inset:0;z-index:60}.ytbox:fullscreen .vid,.ytbox:-webkit-full-screen .vid,.ytbox.fs .vid{padding-top:0;flex:1;border-radius:0}.ytbox:fullscreen .ctl,.ytbox:-webkit-full-screen .ctl,.ytbox.fs .ctl{padding:8px;margin:0;background:#000}.split{display:flex;gap:10px}.split.v{flex-direction:column}.split.h{flex-direction:row}.split .pane{flex:1;min-width:0}.split.h .pdfbox{max-height:82vh;overflow:auto}.split.v .pdfbox{max-height:75vh;overflow:auto}
main.wide{max-width:1200px}
select{padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);font:inherit}.split.v>.pane:first-child{max-width:560px;width:100%;margin-inline:auto}.split{display:flex;gap:10px}.split>div{min-width:0}.split.h{flex-direction:row;align-items:flex-start}.split.h>div{flex:1}.split.v{flex-direction:column}.split .pdfbox{max-height:78vh;overflow:auto}
.ytsh{position:absolute;inset:0;z-index:3;display:grid;place-items:center;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ytsh span{font-size:3rem;color:#fff;display:none}.ytsh.off{background:#000}.ytsh.pz{background:rgba(0,0,0,.25)}.ytsh.off span,.ytsh.pz span{display:block}
#ytplayer.full{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#ytplayer.full .vid{flex:1;padding-top:0;border-radius:0;min-height:0}#ytplayer.full .ctl{margin:0;padding:8px;background:#000}#ytplayer.full .ctl .mut{color:#ddd}.ctl .btn{padding:6px 10px}.ytwm{z-index:4;position:absolute;pointer-events:none;font-weight:700;font-size:15px;direction:ltr;transition:top 1.2s,left 1.2s;text-shadow:0 0 2px rgba(0,0,0,.35)}
</style>

};
let lang='ar';try{lang=localStorage.getItem('lang')||'ar'}catch(e){}
const t=k=>TX[lang][k]||k;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=(o,b)=>(lang==='ar'&&o[b+'_ar'])?o[b+'_ar']:(o[b+'_en']||o[b+'_ar']||'');
const money=n=>Number(n).toLocaleString('en')+' '+t('qar');
const $=s=>document.querySelector(s);
const S={user:null,tab:'lessons',bind:'ok',courses:[],lessons:[],files:[],offers:[],cfg:{},reqs:[],announcements:[],meetings:[],quizzes:[],signup:false,msg:'',err:'',view:null,pay:null,busy:false};

function deviceId(){let id;try{id=localStorage.getItem('did');if(!id){id='web-'+crypto.randomUUID();localStorage.setItem('did',id)}}catch(e){id='web-'+Math.random().toString(36).slice(2)}return id}

async function boot(){
  if(!S.user){render();return}
  S.view=null;S.pay=null;
  const r=await sb.rpc('bind_device',{p_device_id:deviceId(),p_device_name:'Web '+(navigator.platform||'')});
  S.bind=r.error?'error':r.data;
  if(S.bind==='ok'){await loadAll();const pr=await sb.from('profiles').select('phone').eq('id',S.user.id).single();S.wm=(pr.data&&pr.data.phone)||S.user.email||'student'}
  render();
}
async function loadAll(){
  const [c,l,o,s,q,fl,an,mt,qz]=await Promise.all([
    sb.from('courses').select('id,code,title_en,title_ar,instructor,cover_url').order('sort_order'),
    sb.from('lessons').select('id,course_id,title_en,title_ar,duration_seconds,video_source,youtube_id').order('sort_order'),
    sb.from('offers').select('*').eq('is_active',true).order('sort_order'),
    sb.from('app_settings').select('key,value'),
    sb.from('payment_requests').select('*').order('created_at',{ascending:false}),
    sb.from('lesson_files').select('id,lesson_id,kind,title_ar,title_en,storage_path').order('sort_order'),
    sb.from('announcements').select('*,course:courses(title_ar,title_en)').eq('is_published',true).order('publish_at',{ascending:false}),
    sb.from('meetings').select('*,course:courses(title_ar,title_en)').eq('is_published',true).order('starts_at'),
    sb.from('quizzes').select('*,course:courses(title_ar,title_en),lesson:lessons(title_ar,title_en)').eq('status','published').order('created_at',{ascending:false})]);
  S.courses=c.data||[];S.lessons=l.data||[];S.offers=o.data||[];S.reqs=q.data||[];S.files=fl.data||[];S.announcements=an.data||[];S.meetings=mt.data||[];S.quizzes=qz.data||[];
  S.cfg={};(s.data||[]).forEach(x=>S.cfg[x.key]=x.value);
}

function authView(){
  return `<div class="center"><h1 style="font-size:2rem">${t('app')}</h1><p class="mut">${t('tag')}</p></div>
  <div class="card"><form id="af">
  ${S.signup?`<label>${t('name')}</label><input id="a_n" autocomplete="name" required>
  <label>${t('phone')}</label><input id="a_p" type="tel" autocomplete="tel" required>`:''}
  <label>${t('email')}</label><input id="a_e" type="email" autocomplete="email" value="${esc(S.email||'')}" required>
  <label>${t('pass')}</label><input id="a_w" type="password" autocomplete="${S.signup?'new-password':'current-password'}" minlength="6" required>
  ${S.err?`<div class="err">${esc(S.err)}</div>`:''}${S.msg?`<div class="msg">${esc(S.msg)}</div>`:''}
  <button class="btn" style="width:100%" ${S.busy?'disabled':''}>${S.signup?t('signup'):t('signin')}</button></form>
  <p class="center"><a href="#" data-act="toggle">${S.signup?t('haveacc'):t('noacc')}</a></p></div>`;
}

function lessonsView(){
  if(!S.lessons.length)return `<div class="card mut center">${t('nolessons')}</div>`;
  return S.courses.map(c=>{
    const ls=S.lessons.filter(l=>l.course_id===c.id);
    if(!ls.length)return '';
    return `<div class="card">${c.cover_url?`<img src="${esc(c.cover_url)}" alt="" style="width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-bottom:8px">`:''}<b>${esc(pick(c,'title'))}</b><div class="mut">${esc([c.code,c.instructor].filter(Boolean).join(' • '))}</div>
    ${ls.map((l,i)=>`<div class="row" style="margin-top:10px"><span>${i+1}. ${esc(pick(l,'title'))}${l.duration_seconds?` <span class="mut">(${Math.round(l.duration_seconds/60)} ${t('min')})</span>`:''}</span>
    <span style="display:flex;gap:6px">${S.files.some(f=>f.lesson_id===l.id&&/\.pdf$/i.test(f.storage_path))?`<button class="btn ghost sm" data-act="split" data-v="${l.id}">${t('both')}</button>`:''}<button class="btn sm" data-act="play" data-v="${l.id}">▶</button></span></div>
    ${S.files.filter(f=>f.lesson_id===l.id).map(f=>`<div class="row" style="margin-top:4px;padding-inline-start:16px"><span class="mut">${t('k_'+f.kind)}: ${esc(pick(f,'title'))}</span><span style="display:flex;gap:6px"><button class="btn ghost sm" data-act="openfile" data-v="${esc(f.storage_path)}">${t('open')}</button></span></div>`).join('')}`).join('')}</div>`;
  }).join('');
}

function buyView(){
  if(S.pay)return payView();
  const g=k=>S.offers.filter(o=>o.kind===k);
  const sec=k=>g(k).length?`<h2>${t(k)}</h2>`+g(k).map(o=>`<div class="card row"><div>${esc(pick(o,'title'))}</div>
    <div style="text-align:end"><div class="price">${money(o.price_qar)}</div><button class="btn sm" data-act="pay" data-v="${o.id}">${t('pay')}</button></div></div>`).join(''):'';
  const code=`<div class="card"><b>${t('code_q')}</b><div class="row" style="margin-top:8px"><input id="c_in" placeholder="${t('code_ph')}" dir="ltr" autocapitalize="characters" autocomplete="off" style="margin:0"><button class="btn" data-act="redeem">${t('code_btn')}</button></div></div>`;
  return code+((sec('monthly')+sec('course')+sec('lesson'))||`<div class="card mut center">${t('none')}</div>`);
}

function payView(){
  const o=S.pay;
  return `<button class="btn ghost sm" data-act="payback">← ${t('back')}</button>
  <div class="card" style="margin-top:10px"><b>${esc(pick(o,'title'))}</b>
  <div class="row"><span class="mut">${t('amount')}</span><span class="price">${money(o.price_qar)}</span></div>
  <p class="mut" style="margin-bottom:0">${t('alias')}</p>
  <div class="alias">${esc(S.cfg.fawran_alias||'')}</div>
  <div class="center"><button class="btn ghost sm" data-act="copy">${t('copy')}</button></div>
  <p class="mut">${esc(S.cfg['instructions_'+lang]||'')}</p>
  <label>${t('sender')}</label><input id="p_n" required>
  <label>${t('receipt')}</label><input id="p_f" type="file" accept="image/jpeg,image/png,image/webp,application/pdf">
  ${S.err?`<div class="err">${esc(S.err)}</div>`:''}${S.msg?`<div class="msg">${esc(S.msg)}</div>`:''}
  <button class="btn" style="width:100%" data-act="submitpay" ${S.busy?'disabled':''}>${t('send')}</button></div>`;
}

function reqsView(){
  if(!S.reqs.length)return `<div class="card mut center">${t('noreq')}</div>`;
  return S.reqs.map(r=>`<div class="card"><div class="row"><b>${esc(r.offer_title||'')}</b><span class="chip ${r.status}">${t(r.status)}</span></div>
  <div class="mut">${money(r.amount_qar)} • ${new Date(r.created_at).toLocaleDateString(lang==='ar'?'ar-QA':'en-GB')}</div>
  ${r.reject_reason?`<div class="err">${t('reason')}: ${esc(r.reject_reason)}</div>`:''}</div>`).join('');
}

function learningView(){
  const a=S.announcements.map(x=>`<div class="card"><div class="big">${esc(x.title)}</div><div class="mut">${new Date(x.created_at).toLocaleDateString(lang==='ar'?'ar-QA':'en-GB')}</div><p>${esc(x.body)}</p></div>`).join('');
  const m=S.meetings.map(x=>`<div class="card"><div class="row"><div><div class="big">${esc(x.title)}</div><div class="mut">${new Date(x.starts_at).toLocaleString(lang==='ar'?'ar-QA':'en-GB')}</div></div><a class="btn sm" href="${esc(x.meeting_url)}" target="_blank" rel="noopener">${t('open')}</a></div><div class="mut">${esc(x.description||'')}</div></div>`).join('');
  const q=S.quizzes.map(x=>`<div class="card row"><div><div class="big">${esc(x.title)}</div><div class="mut">${esc(x.course?.title_ar||x.course?.title_en||'')}</div></div><button class="btn sm" data-act="quiz" data-v="${x.id}">${t('start')}</button></div>`).join('');
  return `<h2>${t('learning')}</h2><h3>${t('announcements')}</h3>${a||`<div class="card mut">${t('no_learning')}</div>`}<h3>${t('meetings')}</h3>${m||`<div class="card mut">${t('no_learning')}</div>`}<h3>${t('quizzes')}</h3>${q||`<div class="card mut">${t('no_learning')}</div>`}`;
}

function quizResultView(){
  const v=S.view,r=v.result,L={};(r.results||[]).forEach(x=>L[x.id]=x);
  return `<button class="btn ghost sm" data-act="closeplayer">← ${t('back')}</button>
  <div class="card center"><div class="mut">${esc(v.title)}</div><div class="price" style="font-size:2.2rem"><bdi>${r.percent}%</bdi></div>
  <span class="chip ${r.passed?'approved':'rejected'}">${r.passed?t('qz_pass'):t('qz_fail')}</span>
  <div class="mut" style="margin-top:6px"><span dir="ltr">${r.score} / ${r.total_points}</span></div></div>`+
  (v.questions||[]).map((q,i)=>{const a=L[q.id]||{};
    return `<div class="card"><div class="row"><b><span dir="ltr">${i+1}.</span> <bdi>${esc(q.question_text)}</bdi></b><span class="chip ${a.is_correct?'approved':'rejected'}">${a.is_correct?t('qz_ok'):t('qz_no')}</span></div>
    <div class="mut">${t('qz_yours')}: <bdi>${a.selected==null?'—':esc((q.options||[])[a.selected])}</bdi></div>
    ${a.is_correct?'':`<div>${t('qz_right')}: <bdi>${esc((q.options||[])[a.correct_option])}</bdi></div>`}
    ${a.explanation?`<div class="mut" style="margin-top:6px"><bdi>${esc(a.explanation)}</bdi></div>`:''}</div>`}).join('');
}

function quizView(){
  const v=S.view, qs=v.questions||[];
  return `<button class="btn ghost sm" data-act="closeplayer">← ${t('back')}</button><div class="card"><h2>${esc(v.title)}</h2><form id="quizf">${qs.map((q,i)=>`<fieldset style="border:0;padding:0;margin:18px 0"><legend><b><span dir="ltr">${i+1}.</span> <bdi>${esc(q.question_text)}</bdi></b></legend>${(q.options||[]).map((o,j)=>`<label style="display:block;margin:7px 0"><input type="radio" name="q_${q.id}" value="${j}" required style="width:auto;margin-inline-end:7px">${esc(o)}</label>`).join('')}</fieldset>`).join('')}<button class="btn">${t('submit')||'Submit'}</button></form></div>`;
}

const wmCol=()=>S.cfg.wm_color||'#FF0000';
const wmAlpha=()=>Math.min(1,Math.max(.1,parseFloat(S.cfg.wm_alpha||'.5')||.5));
const errCard=(c,det)=>`<div class="card err">${esc(t(c)===c?t('e_generic'):t(c))}${det?`<div class="mut" dir="ltr" style="font-size:.75rem;margin-top:6px;word-break:break-all">${esc(det)}</div>`:''}</div>`;
function ytHtml(id){
  const o=encodeURIComponent(location.origin);
  return `<div class="ytbox" id="ytbox"><div class="vid"><iframe id="ytp" sandbox="allow-scripts allow-same-origin allow-presentation" allow="autoplay; encrypted-media; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"
    src="https://www.youtube.com/embed/${encodeURIComponent(id)}?enablejsapi=1&controls=0&disablekb=1&fs=0&rel=0&modestbranding=1&playsinline=1&iv_load_policy=3&cc_load_policy=0&origin=${o}"></iframe>
    <div class="ytshield" data-act="ytplay"></div>
    <div id="wm" class="ytwm" style="top:12%;left:8%;color:${esc(wmCol())};opacity:${wmAlpha()}">${esc(S.wm||'')}</div></div>
    <div class="ctl"><button class="btn sm" id="ytb" data-act="ytplay">▶</button><button class="btn ghost sm" data-act="ytback">−10</button><button class="btn ghost sm" data-act="ytfwd">+10</button>
    <input id="yts" type="range" min="0" max="1000" value="0" style="margin:0;flex:1;min-width:80px"><span id="ytt" class="mut" style="font-size:.8rem">0:00</span>
    <button class="btn ghost sm" id="ytr" data-act="ytspeed">1x</button><button class="btn ghost sm" id="ytm" data-act="ytmute">🔊</button><button class="btn ghost sm" data-act="ytfs">⛶</button></div></div>
    <p class="mut center">${t('wm')}</p>`;
}
const vdoHtml=v=>`<div class="vid"><iframe src="https://player.vdocipher.com/v2/?otp=${encodeURIComponent(v.otp)}&playbackInfo=${encodeURIComponent(v.pi)}" allow="encrypted-media; fullscreen" allowfullscreen></iframe></div><p class="mut center">${t('wm')}</p>`;
function playerView(){
  const v=S.view;let inner;
  if(v.result)return quizResultView();
  if(v.quiz)return quizView();
  if(v.split){
    const files=S.files.filter(f=>f.lesson_id===v.lid&&/\.pdf$/i.test(f.storage_path));
    const sel=files.length>1?`<select id="spf" style="margin:0;width:auto;max-width:55%">${files.map(f=>`<option value="${esc(f.storage_path)}" ${f.storage_path===v.fpath?'selected':''}>${esc(pick(f,'title'))}</option>`).join('')}</select>`:'';
    const media=v.loading?`<div class="card center mut">${t('loading')}</div>`:v.merror?errCard(v.merror):v.yt?ytHtml(v.yt):vdoHtml(v);
    const pdf=v.perror?errCard('e_generic'):`<div id="pdfbox" class="pdfbox"><div class="center" style="color:#fff;padding:24px">${t('loading')}</div></div>`;
    inner=`<div class="row" style="margin-bottom:8px"><button class="btn ghost sm" data-act="splitdir">${v.dir==='h'?t('stack'):t('side')}</button>${sel}</div>
     <div class="split ${v.dir}"><div class="pane">${media}</div><div class="pane">${pdf}</div></div>`;
  }
  else if(v.error)inner=errCard(v.error,v.det);
  else if(v.loading)inner=`<div class="card center mut">${t('loading')}</div>`;
  else if(v.yt)inner=ytHtml(v.yt);
  else if(v.pdf)inner=`<div id="pdfbox" class="pdfbox"><div class="center" style="color:#fff;padding:24px">${t('loading')}</div></div><p class="mut center">${t('wm')}</p>`;
  else inner=vdoHtml(v);
  return `<button class="btn ghost sm" data-act="closeplayer">← ${t('back')}</button><div style="margin-top:10px">${inner}</div>`;
}
let wmT,ytP=null,ytTimer,ytDrag=false;
function startWm(){clearInterval(wmT);wmT=setInterval(()=>{const e=$('#wm');if(!e){clearInterval(wmT);return}e.style.top=(6+Math.random()*78)+'%';e.style.left=(4+Math.random()*58)+'%'},4500)}
const fmt=s=>{s=Math.max(0,Math.floor(s||0));return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
function loadYT(){return new Promise(res=>{if(window.YT&&YT.Player)return res();window.onYouTubeIframeAPIReady=res;const s=document.createElement('script');s.src='https://www.youtube.com/iframe_api';document.head.appendChild(s)})}
async function startYt(){
  await loadYT();if(!$('#ytp'))return;
  ytP=new YT.Player('ytp',{events:{onStateChange:e=>{const b=$('#ytb');if(b)b.textContent=e.data===1?'⏸':'▶'}}});
  clearInterval(ytTimer);
  ytTimer=setInterval(()=>{const s=$('#yts');if(!ytP||!ytP.getCurrentTime||!s){return}const d=ytP.getDuration()||0,c=ytP.getCurrentTime()||0;
    if(!ytDrag)s.value=d?Math.round(c/d*1000):0;const tt=$('#ytt');if(tt)tt.textContent=fmt(c)+' / '+fmt(d)},500);
}
function wmTile(){
  const x=s=>String(s).replace(/[&<>"']/g,'');
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='280' height='170'><text x='14' y='100' transform='rotate(-24 140 85)' fill='${wmCol()}' fill-opacity='${wmAlpha()}' font-size='17' font-weight='700' font-family='sans-serif'>${x(S.wm||'')}</text></svg>`;
  return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
}
async function drawPdf(){
  const box=$('#pdfbox');if(!box||!S.view||!S.view.pdfData)return;
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const doc=await pdfjsLib.getDocument({data:S.view.pdfData.slice(0)}).promise;
    box.innerHTML='';box.oncontextmenu=e=>e.preventDefault();
    const inn=document.createElement('div');inn.style.position='relative';box.appendChild(inn);
    const w=box.clientWidth-16,dpr=Math.min(window.devicePixelRatio||1,2);
    for(let i=1;i<=doc.numPages;i++){
      const pg=await doc.getPage(i),sc=w/pg.getViewport({scale:1}).width,vp=pg.getViewport({scale:sc*dpr});
      const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
      inn.appendChild(c);await pg.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    }
    const lay=document.createElement('div');lay.className='wmlay';lay.style.backgroundImage=wmTile();inn.appendChild(lay);
  }catch(e){box.innerHTML=`<div class="card err">${t('e_generic')}</div>`}
}

function render(){
  document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';
  const head=`<header><h1>${t('app')}</h1><div><button class="btn ghost sm" data-act="lang">${t('lang')}</button>
   ${S.user?` <button class="btn ghost sm" data-act="logout">${t('out')}</button>`:''}</div></header>`;
  let body;
  if(!S.user)body=authView();
  else if(S.bind!=='ok')body=`<div class="card err">${esc(t(S.bind)===S.bind?t('e_generic'):t(S.bind))}</div>`;
  else if(S.view)body=playerView();
  else{
    const tabs=[['lessons','lessons'],['learning','learning'],['buy','buy'],['reqs','reqs']].map(([k,l])=>`<button class="${S.tab===k?'on':''}" data-act="tab" data-v="${k}">${t(l)}</button>`).join('');
    body=`<div class="tabs">${tabs}</div>`+(S.tab==='lessons'?lessonsView():S.tab==='learning'?learningView():S.tab==='buy'?buyView():reqsView())
     +`<footer><button class="btn danger sm" data-act="delete">${t('del')}</button></footer>`;
  }
  $('#app').innerHTML=head+body;
  $('#app').className=(S.view&&S.view.split)?'wide':'';
  if(S.view&&S.view.yt){startWm();startYt(S.view.yt)}
  if(S.view&&S.view.pdfData)drawPdf();
}

const A={
  lang(){lang=lang==='ar'?'en':'ar';try{localStorage.setItem('lang',lang)}catch(e){}render()},
  toggle(){S.signup=!S.signup;S.err='';S.msg='';render()},
  async logout(){await sb.auth.signOut()},
  tab(v){S.tab=v;S.pay=null;S.err='';S.msg='';render()},
  async play(id){
    const l=S.lessons.find(x=>x.id===id);if(!l)return;
    if(l.video_source==='youtube'&&l.youtube_id){S.view={yt:l.youtube_id};render();return}
    S.view={loading:true};render();
    const {data,error}=await sb.functions.invoke('get-otp',{body:{lesson_id:id,device_id:deviceId()}});
    if(error){let code='e_generic',det=String(error.name||'');
      try{const st=error.context.status,b=await error.context.text();det=st+' '+b.slice(0,160);try{code=JSON.parse(b).error||code}catch(e){}}catch(e){det+=' '+String(error.message||'').slice(0,120)}
      S.view={error:code,det}}
    else S.view={otp:data.otp,pi:data.playbackInfo};
    render();
  },
  closeplayer(){
    if((document.fullscreenElement||document.webkitFullscreenElement)&&(document.exitFullscreen||document.webkitExitFullscreen)){try{(document.exitFullscreen||document.webkitExitFullscreen).call(document)}catch(e){}}
    document.body.style.overflow='';
    if(ytP&&ytP.destroy){try{ytP.destroy()}catch(e){}}ytP=null;clearInterval(ytTimer);S.view=null;render();
  },
  ytfs(){
    const el=$('#ytbox');if(!el)return;
    const isFs=document.fullscreenElement||document.webkitFullscreenElement||el.classList.contains('fs');
    if(isFs){if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen();el.classList.remove('fs');return}
    const req=el.requestFullscreen||el.webkitRequestFullscreen;
    if(req){try{const p=req.call(el);if(p&&p.catch)p.catch(()=>el.classList.add('fs'))}catch(e){el.classList.add('fs')}}else el.classList.add('fs');
  },
  async split(lid){
    const l=S.lessons.find(x=>x.id===lid),f=S.files.find(x=>x.lesson_id===lid&&/\.pdf$/i.test(x.storage_path));
    if(!l||!f)return;
    const v=S.view={split:true,lid,dir:innerWidth>=800?'h':'v',fpath:f.storage_path,loading:true};render();
    if(l.video_source==='youtube'&&l.youtube_id)v.yt=l.youtube_id;
    else{
      const {data,error}=await sb.functions.invoke('get-otp',{body:{lesson_id:lid,device_id:deviceId()}});
      if(error){let code='e_generic';try{code=(await error.context.json()).error||code}catch(e){}v.merror=code}
      else{v.otp=data.otp;v.pi=data.playbackInfo}
    }
    try{const u=await sb.storage.from('lesson-files').createSignedUrl(f.storage_path,300);const r=await fetch(u.data.signedUrl);v.pdfData=await r.arrayBuffer()}catch(e){v.perror=true}
    if(S.view!==v)return;v.loading=false;render();
  },
  splitdir(){const v=S.view;if(!v||!v.split)return;v.dir=v.dir==='h'?'v':'h';const sp=$('.split');if(sp)sp.className='split '+v.dir;const b=$('[data-act="splitdir"]');if(b)b.textContent=v.dir==='h'?t('stack'):t('side')},
  async splitfile(path){
    const v=S.view;if(!v||!v.split)return;v.fpath=path;const box=$('#pdfbox');if(box)box.innerHTML=`<div class="center" style="color:#fff;padding:24px">${t('loading')}</div>`;
    try{const u=await sb.storage.from('lesson-files').createSignedUrl(path,300);const r=await fetch(u.data.signedUrl);v.pdfData=await r.arrayBuffer();drawPdf()}catch(e){if(box)box.innerHTML=`<div class="card err">${t('e_generic')}</div>`}
  },
  ytplay(){if(!ytP)return;ytP.getPlayerState()===1?ytP.pauseVideo():ytP.playVideo()},
  ytback(){if(ytP)ytP.seekTo(Math.max(0,ytP.getCurrentTime()-10),true)},
  ytfwd(){if(ytP)ytP.seekTo(ytP.getCurrentTime()+10,true)},
  ytspeed(){if(!ytP)return;const r=[1,1.25,1.5,2,0.75],n=r[(r.indexOf(ytP.getPlaybackRate())+1)%r.length];ytP.setPlaybackRate(n);$('#ytr').textContent=n+'x'},
  ytmute(){if(!ytP)return;if(ytP.isMuted()){ytP.unMute();$('#ytm').textContent='🔊'}else{ytP.mute();$('#ytm').textContent='🔇'}},
  async redeem(){
    const v=($('#c_in').value||'').trim();if(!v)return;
    const r=await sb.rpc('redeem_code',{p_code:v});
    if(r.error||r.data!=='ok'){alert(r.error?t('e_generic'):r.data==='too_many'?t('code_many'):t('code_bad'));return}
    await loadAll();S.tab='lessons';render();alert(t('code_ok'));
  },
  async openfile(path){
    const isPdf=/\.pdf$/i.test(path);
    const w=isPdf?null:window.open('about:blank','_blank');
    const {data,error}=await sb.storage.from('lesson-files').createSignedUrl(path,300);
    if(error||!data){if(w)w.close();alert(t('e_generic'));return}
    if(!isPdf){if(w)w.location.href=data.signedUrl;else location.href=data.signedUrl;return}
    S.view={pdf:true};render();
    try{const r=await fetch(data.signedUrl);S.view.pdfData=await r.arrayBuffer();drawPdf()}catch(e){S.view={error:'e_generic'};render()}
  },
  async quiz(id){
    const q=S.quizzes.find(x=>x.id===id);if(!q)return;
    const r=await sb.rpc('get_quiz',{p_quiz_id:id});
    if(r.error||!r.data||!(r.data.questions||[]).length){alert(t('e_generic'));return}
    S.view={quiz:id,title:q.title,questions:r.data.questions};render();window.scrollTo(0,0);
  },

  pay(id){S.pay=S.offers.find(o=>o.id===id);S.err='';S.msg='';render()},
  payback(){S.pay=null;S.err='';S.msg='';render()},
  async copy(v,el){try{await navigator.clipboard.writeText(S.cfg.fawran_alias||'');el.textContent=t('copied')}catch(e){}},
  async submitpay(){
    const f=$('#p_f').files[0],n=$('#p_n').value.trim();
    S.err='';S.msg='';
    if(!n||!f){S.err=t('e_need');return render()}
    if(f.size>5*1024*1024||!['image/jpeg','image/png','image/webp','application/pdf'].includes(f.type)){S.err=t('e_file');return render()}
    S.busy=true;render();
    const ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5)||'jpg';
    const path=`${S.user.id}/${Date.now()}.${ext}`;
    const up=await sb.storage.from('receipts').upload(path,f,{contentType:f.type});
    let ok=!up.error;
    if(ok){const r=await sb.rpc('create_payment_request',{p_offer_id:S.pay.id,p_sender_name:n,p_receipt_path:path});ok=!r.error}
    S.busy=false;
    if(!ok){S.err=t('e_generic');return render()}
    await loadAll();S.pay=null;S.tab='reqs';S.msg=t('sent');render();
  },
  async delete(){
    if(!confirm(t('delq')))return;
    const r=await sb.rpc('delete_my_account');
    if(r.error){alert(t('e_generic'));return}
    await sb.auth.signOut({scope:'local'});
  }
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;e.preventDefault();A[el.dataset.act]?.(el.dataset.v,el)});
document.addEventListener('pointerdown',e=>{if(e.target.id==='yts')ytDrag=true});
document.addEventListener('contextmenu',e=>{if(e.target.closest('.ytshield,.pdfbox'))e.preventDefault()});
document.addEventListener('change',e=>{if(e.target.id==='spf')A.splitfile(e.target.value);if(e.target.id==='yts'){ytDrag=false;if(ytP&&ytP.getDuration)ytP.seekTo(ytP.getDuration()*e.target.value/1000,true)}});
document.addEventListener('submit',async e=>{
  if(e.target.id==='quizf'){
    e.preventDefault();const answers={};new FormData(e.target).forEach((v,k)=>{if(k.startsWith('q_'))answers[k.slice(2)]=Number(v)});
    const r=await sb.rpc('submit_quiz',{p_quiz_id:S.view.quiz,p_answers:answers});
    if(r.error){alert(t('e_generic'));return}
    S.view={result:r.data,title:S.view.title,questions:S.view.questions};render();window.scrollTo(0,0);return;
  }
  if(e.target.id!=='af')return;e.preventDefault();
  const email=$('#a_e').value.trim(),pw=$('#a_w').value;
  const nm=S.signup?$('#a_n').value.trim():'',ph=S.signup?$('#a_p').value.trim():'';
  S.email=email;S.err='';S.msg='';S.busy=true;render();
  let res;
  if(S.signup)res=await sb.auth.signUp({email,password:pw,options:{data:{full_name:nm,phone:ph}}});
  else res=await sb.auth.signInWithPassword({email,password:pw});
  S.busy=false;
  if(res.error){S.err=res.error.message;return render()}
  if(S.signup&&!res.data.session){S.msg=t('check');S.signup=false;return render()}
  render();
});
(async()=>{
  const {data:{session}}=await sb.auth.getSession();
  S.user=session?.user||null;
  sb.auth.onAuthStateChange((ev,s)=>{const u=s?.user||null;if((u&&u.id)!==(S.user&&S.user.id)){S.user=u;S.tab='lessons';boot()}});
  boot();
})();
</script>
